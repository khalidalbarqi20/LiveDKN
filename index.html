<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14262b">
<title>LiveDKN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14262b; --surface:#1d3a40; --surface2:#264850; --line:#2f5760;
  --text:#f3efe6; --muted:#8fa9ac; --tea:#f2b441; --tea-soft:rgba(242,180,65,.14);
  --danger:#e8765f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.6}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tea);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.top h1{margin:0;font-size:1.05rem;font-weight:500;color:var(--muted)}
.live{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on i{background:var(--tea)}
.live.err i{background:var(--danger)}

.count{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}
.count b{font-size:5.5rem;line-height:1;font-weight:700;color:var(--tea)}
.count span{font-size:1.2rem;color:var(--text)}
.count small{color:var(--muted);font-size:1rem}
.lamps{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 26px}
.lamps i{width:14px;height:14px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.lamps i.on{background:var(--tea);border-color:var(--tea);box-shadow:0 0 12px 2px rgba(242,180,65,.55)}

/* list */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:16px;padding:12px 14px;border:1px solid transparent}
.row.on{border-color:rgba(242,180,65,.5);background:linear-gradient(0deg,var(--surface),var(--surface)),var(--tea-soft)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.15rem;
  background:var(--surface2);color:var(--muted);border:2px solid var(--line)}
.row.on .av{background:var(--tea);color:#2a1d00;border-color:var(--tea)}
.info{flex:1;min-width:0}
.name{font-weight:500;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{font-size:.85rem;color:var(--muted)}
.row.on .state{color:var(--tea)}
.acts{display:none;gap:6px}
body.admin .acts{display:flex}
.ib{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;font-size:.8rem;color:var(--text)}
.ib.del{color:var(--danger);border-color:rgba(232,118,95,.5)}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:1px dashed var(--line);border-radius:16px}

/* admin */
.admin-bar{margin-top:28px;display:flex;justify-content:center}
.link{background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;text-underline-offset:4px}
.add{display:none;gap:8px;margin-top:18px}
body.admin .add{display:flex}
.add input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.btn{background:var(--tea);color:#2a1d00;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,12,14,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:1.2rem}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.field{margin-bottom:12px}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.copy{display:flex;gap:8px;align-items:stretch}
.copy code{flex:1;min-width:0;direction:ltr;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;font-size:.75rem;overflow-x:auto;white-space:nowrap}
.steps{margin:14px 0 0;padding-inline-start:20px;color:var(--muted);font-size:.85rem}
.steps li{margin-bottom:4px}
.pin{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center;letter-spacing:.4em;font-size:1.2rem;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== إعدادات: غيّرها هنا (أو اتركها فاضية وتنحفظ من الصفحة) ===== */
const CONFIG = {
  DB_URL: "https://live-dkn-default-rtdb.firebaseio.com",      // مثال: https://my-project-default-rtdb.firebaseio.com
  ADMIN_PIN: "1234"  // رمز وضع الإدارة (غيّره)
};
/* ================================================================ */

const $ = (s) => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k) } catch(e){ return null } },
  set(k,v){ try { localStorage.setItem(k,v) } catch(e){} }
};
let DB = (CONFIG.DB_URL || store.get("dbUrl") || "").trim().replace(/\/+$/, "");
let members = {}, presence = {}, status = "idle", admin = false;

const nf = new Intl.NumberFormat("en-US");
const n = (x) => nf.format(x);

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1800);
}

async function api(method, path, body){
  const r = await fetch(DB + path + ".json", {
    method,
    headers: {"Content-Type":"application/json"},
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function ago(ts){
  if(!ts) return "";
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if(s < 60) return "الآن";
  if(s < 3600) return "قبل " + n(Math.floor(s/60)) + " د";
  if(s < 86400) return "قبل " + n(Math.floor(s/3600)) + " س";
  return "قبل " + n(Math.floor(s/86400)) + " يوم";
}

function randomId(){
  const chars = "abcdefghijkmnpqrstuvwxyz23456789";
  const a = new Uint8Array(8); crypto.getRandomValues(a);
  return Array.from(a, (b) => chars[b % chars.length]).join("");
}

/* ---------- الرسم ---------- */
function render(){
  const app = $("#app");
  document.body.classList.toggle("admin", admin);

  if(!DB){
    app.innerHTML = `
      <div class="top"><h1 dir="ltr">LiveDKN</h1></div>
      <h2 style="margin:24px 0 6px">ربط قاعدة البيانات</h2>
      <p style="color:var(--muted);margin:0 0 14px">الصق رابط Realtime Database من Firebase مرة وحدة.</p>
      <div class="add" style="display:flex;margin-top:0">
        <input id="dburl" dir="ltr" placeholder="https://xxxx-default-rtdb.firebaseio.com" inputmode="url">
        <button class="btn" id="savedb">حفظ</button>
      </div>`;
    $("#savedb").onclick = () => {
      const v = $("#dburl").value.trim().replace(/\/+$/, "");
      if(!/^https:\/\/.+/.test(v)) return toast("الرابط غير صحيح");
      store.set("dbUrl", v); DB = v; start();
    };
    return;
  }

  const list = Object.entries(members).map(([id, m]) => ({
    id, name: m.name, on: !!(presence[id] && presence[id].in), t: presence[id] && presence[id].t
  })).sort((a, b) => (b.on - a.on) || a.name.localeCompare(b.name, "ar"));
  const total = list.length, here = list.filter(x => x.on).length;
  const shown = admin ? list : list.filter(x => x.on);
  const liveTxt = status === "on" ? "مباشر" : status === "err" ? "لا يوجد اتصال" : "جاري الاتصال";

  app.innerHTML = `
    <div class="top"><h1 dir="ltr">LiveDKN</h1>
      <div class="live ${status}"><i></i>${liveTxt}</div></div>
    <div class="count"><b>${n(here)}</b><span>موجود</span>${admin ? `<small>من ${n(total)}</small>` : ""}</div>
    <div class="list" id="list"></div>
    <form class="add" id="addform">
      <input id="newname" placeholder="اسم العضو الجديد" maxlength="28" autocomplete="off">
      <button class="btn" type="submit">إضافة</button>
    </form>
    <div class="admin-bar"><button class="link" id="toggleAdmin">${admin ? "إخفاء الإدارة" : "الإدارة"}</button></div>`;

  const box = $("#list");
  if(!total){
    box.innerHTML = `<div class="empty">ما فيه أعضاء للحين.<br>افتح «الإدارة» وأضف أول عضو.</div>`;
  } else if(!shown.length){
    box.innerHTML = `<div class="empty">ما أحد في الاستراحة الحين</div>`;
  }
  shown.forEach(x => {
    const row = document.createElement("div");
    row.className = "row" + (x.on ? " on" : "");
    row.innerHTML = `<div class="av"></div>
      <div class="info"><div class="name"></div><div class="state"></div></div>
      <div class="acts">
        <button class="ib" data-a="link">الرابط</button>
        <button class="ib" data-a="toggle">${x.on ? "تسجيل خروج" : "تسجيل دخول"}</button>
        <button class="ib del" data-a="del">حذف</button>
      </div>`;
    row.querySelector(".av").textContent = (x.name || "؟").trim().charAt(0);
    row.querySelector(".name").textContent = x.name;
    row.querySelector(".state").textContent = x.on
      ? "موجود" + (x.t ? " منذ " + ago(x.t).replace("قبل ", "") : "")
      : (x.t ? "طلع " + ago(x.t) : "غير موجود");
    row.querySelectorAll("[data-a]").forEach(b => b.onclick = () => action(b.dataset.a, x));
    box.appendChild(row);
  });

  $("#toggleAdmin").onclick = () => admin ? (admin = false, render()) : askPin();
  $("#addform").onsubmit = addMember;
}

/* ---------- الإدارة ---------- */
function openSheet(html){ $("#sheet").innerHTML = html; $("#modal").classList.add("show"); }
function closeSheet(){ $("#modal").classList.remove("show"); }
$("#modal").addEventListener("click", (e) => { if(e.target.id === "modal") closeSheet(); });
document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeSheet(); });

function askPin(){
  openSheet(`<h2>وضع الإدارة</h2><p>اكتب الرمز لإضافة أو حذف الأعضاء.</p>
    <input class="pin" id="pin" type="password" inputmode="numeric" autocomplete="off">
    <button class="btn" id="pinok" style="width:100%">دخول</button>`);
  const go = () => {
    if($("#pin").value === CONFIG.ADMIN_PIN){ admin = true; closeSheet(); render(); }
    else { toast("الرمز غير صحيح"); $("#pin").value = ""; }
  };
  $("#pinok").onclick = go;
  $("#pin").onkeydown = (e) => { if(e.key === "Enter") go(); };
  $("#pin").focus();
}

async function addMember(e){
  e.preventDefault();
  const name = $("#newname").value.trim();
  if(!name) return;
  const id = randomId();
  try{
    await api("PUT", "/members/" + id, {name});
    await api("PUT", "/presence/" + id, {in:false, t:{".sv":"timestamp"}});
    members[id] = {name}; await load();
    showLinks(id, name);
  }catch(err){ toast("تعذّرت الإضافة، راجع القواعد"); }
}

async function action(a, x){
  try{
    if(a === "link") return showLinks(x.id, x.name);
    if(a === "toggle"){
      await api("PUT", "/presence/" + x.id, {in:!x.on, t:{".sv":"timestamp"}});
    }
    if(a === "del"){
      if(!confirm("حذف " + x.name + "؟")) return;
      await api("DELETE", "/presence/" + x.id);
      await api("DELETE", "/members/" + x.id);
    }
    await load();
  }catch(err){ toast("تعذّر التنفيذ"); }
}

function showLinks(id, name){
  const url = DB + "/presence/" + id + ".json";
  const bin = '{"in":true,"t":{".sv":"timestamp"}}';
  const bout = '{"in":false,"t":{".sv":"timestamp"}}';
  const f = (label, val) => `<div class="field"><label>${label}</label>
    <div class="copy"><code>${val.replace(/</g, "&lt;")}</code><button class="ib" data-copy="${encodeURIComponent(val)}">نسخ</button></div></div>`;
  openSheet(`<h2>إعداد ${name.replace(/</g, "&lt;")}</h2>
    <p>هذي بيانات الاختصار لهذا العضو. أرسلها له مع الخطوات.</p>
    ${f("الرابط (نفسه للدخول والخروج)", url)}
    ${f("نص الدخول", bin)}
    ${f("نص الخروج", bout)}
    <ol class="steps">
      <li>الاختصارات ← أتمتة ← جديد ← «وصلت» ← يحدد موقع الاستراحة.</li>
      <li>اختيار «تشغيل فوري» وإيقاف الإشعار.</li>
      <li>إضافة «نص» ولصق نص الدخول.</li>
      <li>إضافة «الحصول على محتويات URL»: الرابط أعلاه، الطريقة PUT، نص الطلب: ملف ← النص.</li>
      <li>نفس الشي لأتمتة «غادرت» بنص الخروج.</li>
    </ol>
    <button class="btn ghost" id="closeSheet" style="width:100%;margin-top:14px">إغلاق</button>`);
  $("#closeSheet").onclick = closeSheet;
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try{ await navigator.clipboard.writeText(decodeURIComponent(b.dataset.copy)); toast("تم النسخ"); }
    catch(e){ toast("انسخ النص يدويًا"); }
  });
}

/* ---------- التحميل والتحديث اللحظي ---------- */
async function load(){
  try{
    const [m, p] = await Promise.all([api("GET", "/members"), api("GET", "/presence")]);
    members = m || {}; presence = p || {}; status = "on";
  }catch(err){ status = "err"; }
  render();
}

let streams = [], deb;
function start(){
  streams.forEach(s => s.close()); streams = [];
  render(); if(!DB) return;
  load();
  const kick = () => { clearTimeout(deb); deb = setTimeout(load, 250); };
  ["/presence", "/members"].forEach(p => {
    try{ const es = new EventSource(DB + p + ".json"); es.onmessage = kick; streams.push(es); }catch(e){}
  });
}
setInterval(() => { if(DB) load(); }, 30000);
setInterval(() => { if(DB && !$("#modal").classList.contains("show")) render(); }, 60000);
start();
</script>
</body>
</html>
